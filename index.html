<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <meta
            name="description"
            content="Portfolio by Christopher Matthew showcasing architectural projects, architecture"
        />
        <meta name="keywords" content="architecture, portfolio" />
        <meta name="author" content="Christopher Matthew" />
        <title>Chris Matthew Portfolio</title>
        <!-- Favicon -->
        <link rel="icon" href="" type="" />
        <!-- Styles -->
        <link rel="stylesheet" href="assets/css/styles.css" />
        <!-- Font Awesome icons (free version)-->
        <script
            defer
            src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
            crossorigin="anonymous"
        ></script>
        <!-- Google fonts-->
        <link
            href="https://fonts.googleapis.com/css?family=Montserrat:400,700"
            rel="stylesheet"
            type="text/css"
        />
        <link
            href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic"
            rel="stylesheet"
            type="text/css"
        />
        <!-- Bootstrap CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="bg-dark text-white text-center py-4">
            <div class="container">
                <h1 class="mb-0">Christopher Matthew</h1>
                <p class="lead mb-0">Architectural Designer</p>
            </div>
        </header>
        <main class="bg-light flex-fill">
            <div
                id="carouselExampleSlidesOnly"
                class="carousel slide"
                data-bs-ride="carousel"
            >
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img
                            src="assets\images\placeholder\Friends_Towers,_Munich,_June_2019.jpg"
                            class="d-block w-100 h-100 carousel-img"
                            alt="Placeholder Image 1"
                            width="960"
                            height="640"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src="assets\images\placeholder\Architectural_drawing_of_the_Public_Offices,_Toowoomba,_1887.jpg"
                            class="d-block w-100 h-100 carousel-img"
                            alt="Placeholder Image 2"
                            width="1400"
                            height="1121"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src="assets\images\placeholder\Architectural_Masterplan_Model_of_Lieb_Tang_Rodfai_Villas.jpg"
                            class="d-block w-100 h-100 carousel-img"
                            alt="Placeholder Image 3"
                            width="1280"
                            height="731"
                        />
                    </div>
                </div>
                <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselExampleSlidesOnly"
                    data-bs-slide="prev"
                >
                    <span
                        class="carousel-control-prev-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselExampleSlidesOnly"
                    data-bs-slide="next"
                >
                    <span
                        class="carousel-control-next-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </main>

        <footer class="bg-dark text-white text-center py-4 mt-auto">
            <div class="container">
                <p class="mb-1">© 2026 Christopher Matthew</p>
                <p class="mb-2">Architectural Portfolio</p>

                <div class="d-flex justify-content-center gap-3">
                    <a href="#" class="text-white" title="Instagram">
                        <i class="fab fa-instagram fa-lg"></i>
                    </a>
                    <a href="#" class="text-white" title="LinkedIn">
                        <i class="fab fa-linkedin fa-lg"></i>
                    </a>
                    <a
                        href="mailto:you@example.com"
                        class="text-white"
                        title="Email Me"
                    >
                        <i class="fas fa-envelope fa-lg"></i>
                    </a>
                </div>
            </div>
        </footer>

        <!-- Bootstrap JS -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
